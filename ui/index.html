<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TrailBear 🐻</title>
<style>
  :root {
    --green: #2d7a4f;
    --green-light: #e8f5ee;
    --green-mid: #4caf80;
    --brown: #7c4d2a;
    --brown-light: #f5ede5;
    --sky: #e8f4fd;
    --text: #1e1e1e;
    --text-muted: #666;
    --border: #d4d4d4;
    --radius: 10px;
    --shadow: 0 2px 8px rgba(0,0,0,.08);
    --header-h: 56px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f7f9f7; color: var(--text); }

  /* ── Header ── */
  header {
    background: var(--green); color: #fff;
    padding: 0 20px; height: var(--header-h);
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
    position: sticky; top: 0; z-index: 100;
  }
  header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -.5px; white-space: nowrap; }
  header .logo { font-size: 1.6rem; flex-shrink: 0; }
  header .stats-bar { margin-left: auto; display: flex; gap: 16px; font-size: .82rem; opacity: .92; }
  header .stat { text-align: center; }
  header .stat span { display: block; font-weight: 700; font-size: 1rem; }

  /* ── Layout ── */
  .layout { display: flex; min-height: calc(100vh - var(--header-h)); }

  aside {
    width: 252px; flex-shrink: 0;
    background: #fff; border-right: 1px solid var(--border);
    padding: 16px; overflow-y: auto;
    position: sticky; top: var(--header-h); height: calc(100vh - var(--header-h));
  }
  main {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    height: calc(100vh - var(--header-h));
    overflow: hidden;
  }
  .toolbar { flex-shrink: 0; padding: 14px 16px 0; }
  #trailContainer {
    flex: 1; min-height: 0;
    overflow: auto;
    overscroll-behavior: contain;
    padding: 0 16px 16px;          /* no padding-top: avoids sticky header gap */
  }
  /* top spacing via margin so it doesn't create space above sticky thead */
  #trailContainer > * { margin-top: 12px; }

  /* ── Filter sidebar ── */
  .filter-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  aside h2 { font-size: .75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
  .filter-group { margin-bottom: 14px; }
  .filter-group label { display: block; font-size: .78rem; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
  .filter-group input, .filter-group select {
    width: 100%; padding: 7px 10px; border: 1px solid var(--border);
    border-radius: 6px; font-size: .85rem; background: #fafafa;
  }
  .filter-group input:focus, .filter-group select:focus { outline: 2px solid var(--green-mid); border-color: transparent; }
  .range-row { display: flex; gap: 6px; }
  .range-row input { flex: 1; }
  .toggle-row { display: flex; gap: 6px; }
  .toggle-btn {
    flex: 1; padding: 6px; border: 1px solid var(--border); border-radius: 6px;
    background: #fafafa; cursor: pointer; font-size: .8rem; color: var(--text-muted);
    transition: all .15s;
  }
  .toggle-btn.active { background: var(--green); color: #fff; border-color: var(--green); }
  .btn-reset {
    width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px;
    background: #fff; cursor: pointer; font-size: .85rem; color: var(--text-muted);
    margin-top: 8px; transition: background .15s;
  }
  .btn-reset:hover { background: #f0f0f0; }

  /* ── Toolbar ── */
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar .count { font-size: .88rem; color: var(--text-muted); }
  .toolbar-right { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; max-width: 100%; }
  .sort-select { padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; font-size: .85rem; max-width: 150px; }

  .btn-primary {
    background: var(--green); color: #fff; border: none; border-radius: 7px;
    padding: 9px 14px; cursor: pointer; font-size: .9rem; font-weight: 600;
    display: flex; align-items: center; gap: 5px; transition: background .15s; white-space: nowrap;
  }
  .btn-primary:hover { background: #235f3d; }

  .btn-export {
    background: #fff; color: var(--green); border: 1px solid var(--green); border-radius: 7px;
    padding: 9px 14px; cursor: pointer; font-size: .9rem; font-weight: 600;
    display: flex; align-items: center; gap: 5px; transition: all .15s; white-space: nowrap;
  }
  .btn-export:hover { background: var(--green-light); }

  /* ── View + filter toggle buttons ── */
  .view-toggle { display: flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
  .view-btn {
    padding: 8px 11px; border: none; background: #fff; cursor: pointer;
    font-size: 1rem; line-height: 1; color: var(--text-muted); transition: all .15s;
  }
  .view-btn:first-child { border-right: 1px solid var(--border); }
  .view-btn.active { background: var(--green); color: #fff; }

  .btn-filter-toggle {
    display: none; /* shown only on mobile via media query */
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 7px;
    background: #fff; cursor: pointer; font-size: .85rem; color: var(--text-muted);
    align-items: center; gap: 5px; transition: all .15s; white-space: nowrap;
  }
  .btn-filter-toggle.active { background: var(--green-light); border-color: var(--green-mid); color: var(--green); }

  /* ── Cards grid ── */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }

  .card {
    background: #fff; border-radius: var(--radius); box-shadow: var(--shadow);
    border: 1px solid var(--border); overflow: hidden; transition: box-shadow .15s, transform .15s;
  }
  .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.12); transform: translateY(-1px); }
  .card-header { padding: 13px 15px 9px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card-title { font-size: .95rem; font-weight: 700; line-height: 1.3; }
  .card-type {
    font-size: .68rem; padding: 3px 7px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;
    font-weight: 600; letter-spacing: .3px;
  }
  .type-traumschleife { background: var(--green-light); color: var(--green); }
  .type-auto-pedestre { background: var(--sky); color: #1a6fa8; }
  .type-other { background: var(--brown-light); color: var(--brown); }

  .card-meta { padding: 0 15px 11px; display: grid; grid-template-columns: 1fr 1fr; gap: 5px 12px; }
  .meta-item { display: flex; align-items: center; gap: 5px; font-size: .8rem; color: var(--text-muted); }
  .meta-item .icon { font-size: .9rem; }
  .meta-item strong { color: var(--text); }

  .card-footer { padding: 9px 15px; border-top: 1px solid #f0f0f0; display: flex; align-items: center; gap: 8px; }
  .rating { display: flex; align-items: center; gap: 4px; font-size: .85rem; }
  .stars { color: #f5a623; }
  .card-actions { margin-left: auto; display: flex; gap: 5px; }
  .btn-icon {
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: #fff; cursor: pointer; font-size: .85rem; transition: all .15s;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .btn-icon:hover { background: var(--green-light); border-color: var(--green-mid); }

  /* ── List / table ── */
  /* .table-scroll is now only a visual frame — scrolling is on #trailContainer */
  .table-scroll { border-radius: var(--radius); border: 1px solid var(--border); background: #fff; width: max-content; min-width: 100%; }
  .trail-table { width: 100%; border-collapse: collapse; font-size: .875rem; min-width: 560px; }
  .trail-table thead th {
    padding: 10px 12px; text-align: left; font-size: .72rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted);
    background: #fafafa; border-bottom: 2px solid var(--border); white-space: nowrap;
    position: sticky; top: 0; z-index: 2;
  }
  .trail-table tbody tr { border-bottom: 1px solid #f0f0f0; transition: background .1s; }
  .trail-table tbody tr:last-child { border-bottom: none; }
  .trail-table tbody tr:hover { background: #f7fdf9; }
  .trail-table td { padding: 9px 12px; vertical-align: middle; }
  .trail-table td.name-cell { font-weight: 600; }
  .trail-table td.num { text-align: right; white-space: nowrap; color: var(--text); }
  .trail-table td.num.muted { color: var(--text-muted); }
  .row-badge { display: inline-block; font-size: .63rem; padding: 2px 6px; border-radius: 10px; font-weight: 600; white-space: nowrap; margin-top: 2px; }
  .row-actions { display: flex; gap: 4px; justify-content: flex-end; white-space: nowrap; }
  .trail-table .star { color: #f5a623; font-weight: 700; }

  /* ── Modals ── */
  .overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45);
    z-index: 200; align-items: center; justify-content: center;
  }
  .overlay.open { display: flex; }
  .modal {
    background: #fff; border-radius: 14px; width: 620px; max-width: 96vw;
    max-height: 90vh; overflow-y: auto; box-shadow: 0 8px 40px rgba(0,0,0,.2);
    padding: 24px;
  }
  .modal h2 { font-size: 1.15rem; margin-bottom: 18px; color: var(--green); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid .full { grid-column: 1 / -1; }
  .field label { display: block; font-size: .78rem; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--border);
    border-radius: 7px; font-size: .9rem; font-family: inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--green-mid); border-color: transparent; }
  .field textarea { resize: vertical; min-height: 80px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .btn-secondary { padding: 9px 16px; border: 1px solid var(--border); border-radius: 7px; background: #fff; cursor: pointer; font-size: .9rem; }
  .btn-secondary:hover { background: #f5f5f5; }
  .btn-danger { padding: 9px 16px; border: none; border-radius: 7px; background: #e53e3e; color: #fff; cursor: pointer; font-size: .9rem; }

  /* ── Detail modal extras ── */
  .detail-tabs { display: flex; gap: 2px; margin-bottom: 14px; border-bottom: 2px solid var(--border); }
  .tab-btn {
    padding: 8px 14px; border: none; background: none; cursor: pointer;
    font-size: .88rem; color: var(--text-muted); border-bottom: 2px solid transparent;
    margin-bottom: -2px; transition: all .15s;
  }
  .tab-btn.active { color: var(--green); border-bottom-color: var(--green); font-weight: 600; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── Executions list ── */
  .exec-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .exec-item {
    padding: 10px 13px; background: #fafafa; border-radius: 8px;
    border: 1px solid var(--border); display: flex; align-items: center; gap: 10px;
  }
  .exec-date { font-weight: 600; }
  .item-actions { margin-left: auto; display: flex; gap: 4px; flex-shrink: 0; }
  .btn-sm { padding: 5px 9px; border: 1px solid var(--border); border-radius: 5px; background: #fff; cursor: pointer; font-size: .75rem; }
  .btn-sm:hover { background: #f0f0f0; }
  .add-inline { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  .add-inline input { flex: 1; min-width: 100px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: .85rem; }

  /* ── Impressions per-execution cards ── */
  .imp-exec-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .imp-exec-card {
    border: 1px solid var(--border); border-radius: 10px; background: #fff;
    overflow: hidden;
  }
  .imp-exec-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; background: #fafafa; border-bottom: 1px solid #f0f0f0;
  }
  .imp-exec-date { font-weight: 700; font-size: .9rem; flex: 1; }
  .imp-exec-header .item-actions { margin-left: 0; }
  .imp-body { padding: 10px 14px; }
  .imp-body-empty { padding: 8px 14px; font-size: .85rem; color: var(--text-muted); font-style: italic; }
  .imp-stars { color: #f5a623; font-weight: 700; font-size: 1rem; }
  .imp-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
  .imp-tag {
    font-size: .72rem; padding: 2px 8px; border-radius: 10px;
    background: var(--sky); color: #1a6fa8; font-weight: 600;
  }
  .imp-tag.green { background: var(--green-light); color: var(--green); }
  .imp-notes-text { font-size: .85rem; color: var(--text-muted); margin-top: 6px; line-height: 1.45; }

  /* Inline impression form (add / edit) */
  .imp-inline-form {
    border-top: 1px solid var(--border); padding: 12px 14px; background: #fefefe;
    display: none;
  }
  .imp-inline-form.open { display: block; }
  .imp-form-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .imp-form-row select, .imp-form-row input {
    padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px;
    font-size: .82rem; flex: 1; min-width: 100px;
  }
  .imp-form-row select { flex: 0 0 auto; }
  .imp-form-textarea {
    width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px;
    font-size: .82rem; font-family: inherit; resize: vertical; min-height: 60px;
    margin-bottom: 6px;
  }
  .imp-form-footer { display: flex; justify-content: flex-end; gap: 6px; }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--green); color: #fff; padding: 11px 20px; border-radius: 8px;
    font-size: .9rem; font-weight: 600; z-index: 999; opacity: 0; transition: opacity .3s;
    pointer-events: none; box-shadow: 0 4px 12px rgba(0,0,0,.25); white-space: nowrap;
  }
  .toast.show { opacity: 1; }
  .toast.error { background: #e53e3e; }

  /* ── Misc ── */
  .loading { text-align: center; padding: 40px; color: var(--text-muted); font-size: 1.1rem; }
  .empty { text-align: center; padding: 48px 20px; color: var(--text-muted); }
  .empty .icon { font-size: 3rem; margin-bottom: 10px; }

  /* ────────────────────────────────────────────────────────────────
     RESPONSIVE  ≤ 767px
  ──────────────────────────────────────────────────────────────── */
  @media (max-width: 767px) {

    /* Header — compact */
    header { padding: 0 14px; gap: 8px; }
    header h1 { font-size: 1.1rem; }
    header .logo { font-size: 1.4rem; }
    header .stats-bar { gap: 10px; font-size: .72rem; }
    header .stat span { font-size: .9rem; }
    /* Hide "to do" stat to save space */
    header .stat-todo { display: none; }

    /* Fixed layout: header stays sticky, layout fills the exact remaining space.
       position:fixed is more reliable than calc(100dvh-…) on iOS Safari. */
    html, body { overflow: hidden; height: 100%; }
    header { position: fixed; top: 0; left: 0; right: 0; }
    .layout {
      position: fixed;
      top: var(--header-h); left: 0; right: 0; bottom: 0;
      flex-direction: column;
      height: auto; min-height: 0;
      overflow: hidden;
    }
    /* Sidebar — hidden drawer */
    aside {
      width: 100%; height: auto; position: static; flex-shrink: 0;
      max-height: 50vh; overflow-y: auto;
      border-right: none; border-bottom: 1px solid var(--border);
      display: none; padding: 14px 16px 8px;
    }
    aside.open { display: block; }
    /* main fills all remaining height; inherits flex-column + overflow:hidden from desktop */
    main { flex: 1 1 0; min-height: 0; height: auto; }
    .toolbar { padding: 10px 14px 8px; }
    /* safe-area-inset-bottom ensures last row is above the iOS home indicator */
    #trailContainer {
      padding: 0 14px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      min-height: 0;
    }

    /* Filter close button visible on mobile */
    .filter-close { display: flex !important; }

    /* Toolbar — items wrap sensibly */
    .toolbar { gap: 6px; }
    .toolbar .count { flex: 1 1 100%; order: -1; margin-bottom: 2px; }
    .sort-select { flex: 1; max-width: none; font-size: .82rem; }
    .toolbar-right { width: 100%; margin-left: 0; gap: 6px; justify-content: flex-start; }

    /* Show filter toggle button */
    .btn-filter-toggle { display: flex; }

    /* Shorten "Add trail" to just "+" and hide export label */
    .btn-add-label { display: none; }
    .btn-export-label { display: none; }

    /* Cards — single column */
    .cards { grid-template-columns: 1fr; gap: 10px; }

    /* Table — smaller text/padding on mobile */
    .trail-table { font-size: .82rem; }
    .trail-table td, .trail-table thead th { padding: 8px 10px; }

    /* Modal — bottom sheet */
    .overlay { align-items: flex-end; }
    .modal {
      width: 100%; max-width: 100%; border-radius: 18px 18px 0 0;
      max-height: 92dvh; padding: 20px 18px; margin: 0;
    }
    /* drag handle hint */
    .modal::before {
      content: ''; display: block; width: 40px; height: 4px;
      background: var(--border); border-radius: 2px; margin: -8px auto 14px;
    }
    .form-grid { grid-template-columns: 1fr; }
    .modal-footer { justify-content: stretch; }
    .modal-footer button { flex: 1; }
  }

  /* Close button inside filter panel (mobile only) */
  .filter-close {
    display: none;
    padding: 4px 8px; border: none; background: none; cursor: pointer;
    font-size: 1.1rem; color: var(--text-muted); line-height: 1;
  }
</style>
</head>
<body>

<header>
  <span class="logo">🐻</span>
  <h1>TrailBear</h1>
  <div class="stats-bar" id="statsBar"></div>
</header>

<div class="layout">
  <aside id="filterPanel">
    <div class="filter-header">
      <h2>Filters</h2>
      <button class="filter-close" onclick="toggleFilters()" title="Close filters">✕</button>
    </div>

    <div class="filter-group">
      <label>Search</label>
      <input type="text" id="fSearch" placeholder="Trail name…">
    </div>
    <div class="filter-group">
      <label>Activity</label>
      <select id="fActivity">
        <option value="">All</option>
        <option value="hiking">Hiking</option>
        <option value="biking">Biking</option>
        <option value="mtb">MTB</option>
        <option value="gravel">Gravel</option>
        <option value="road">Road</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Trail type</label>
      <select id="fTrailType">
        <option value="">All</option>
        <option value="Traumschleife">Traumschleife</option>
        <option value="Auto-Pedestre">Auto-Pédestre</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Hiked?</label>
      <div class="toggle-row">
        <button class="toggle-btn active" data-val="" id="hikedAll">All</button>
        <button class="toggle-btn" data-val="true" id="hikedYes">✓ Yes</button>
        <button class="toggle-btn" data-val="false" id="hikedNo">✗ No</button>
      </div>
    </div>
    <div class="filter-group">
      <label>Distance (km)</label>
      <div class="range-row">
        <input type="number" id="fMinKm" placeholder="Min" min="0" step="1">
        <input type="number" id="fMaxKm" placeholder="Max" min="0" step="1">
      </div>
    </div>
    <div class="filter-group">
      <label>Elevation gain (m)</label>
      <div class="range-row">
        <input type="number" id="fMinAsc" placeholder="Min" min="0" step="50">
        <input type="number" id="fMaxAsc" placeholder="Max" min="0" step="50">
      </div>
    </div>
    <div class="filter-group">
      <label>Drive time (min)</label>
      <div class="range-row">
        <input type="number" id="fMinDrive" placeholder="Min" min="0" step="5">
        <input type="number" id="fMaxDrive" placeholder="Max" min="0" step="5">
      </div>
    </div>
    <div class="filter-group">
      <label>Hiked between</label>
      <div class="range-row" style="flex-direction:column;gap:4px;">
        <input type="date" id="fDateFrom">
        <input type="date" id="fDateTo">
      </div>
    </div>
    <button class="btn-reset" onclick="resetFilters()">↺ Reset filters</button>
  </aside>

  <main>
    <div class="toolbar">
      <span class="count" id="trailCount">Loading…</span>
      <div class="toolbar-right">
        <select class="sort-select" id="sortBy" onchange="loadTrails()">
          <option value="">Name</option>
          <option value="distance_km">Distance</option>
          <option value="elevation_gain_m">Elevation</option>
          <option value="drive_time_min">Drive time</option>
          <option value="last_executed_on">Last hiked</option>
          <option value="rating">Rating</option>
        </select>
        <button class="btn-filter-toggle" id="filterToggleBtn" onclick="toggleFilters()" title="Toggle filters">
          ⚙ Filters
        </button>
        <div class="view-toggle">
          <button class="view-btn" id="btnCards" onclick="setView('cards')" title="Card view">⊞</button>
          <button class="view-btn" id="btnList"  onclick="setView('list')"  title="List view">☰</button>
        </div>
        <button class="btn-export" onclick="exportExcel()" title="Export to Excel">
          📥 <span class="btn-export-label">Export</span>
        </button>
        <button class="btn-primary" onclick="openAddTrail()" title="Add trail">
          <span>＋</span><span class="btn-add-label"> Add trail</span>
        </button>
      </div>
    </div>
    <div id="trailContainer">
      <div class="loading">Loading trails… 🐾</div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<!-- Add/Edit Trail modal -->
<div class="overlay" id="trailModal">
  <div class="modal">

          <label>GPX URL</label>
          <input type="url" name="gpx_url" placeholder="https://…">

<!-- Trail detail modal -->
<div class="overlay" id="detailModal">
  <div class="modal" style="width:660px">
    <h2 id="detailModalTitle"></h2>
    <div class="detail-tabs">
      <button class="tab-btn active" onclick="showTab('tabInfo', event)">Info</button>
      <button class="tab-btn" onclick="showTab('tabExecs', event)">Hikes</button>
      <button class="tab-btn" onclick="showTab('tabImps', event)">Impressions</button>
    </div>

    <div class="tab-panel active" id="tabInfo">
      <div id="detailInfo"></div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeModal('detailModal')">Close</button>
        <button class="btn-danger" onclick="deleteCurrentTrail()">Delete</button>
        <button class="btn-primary" onclick="editCurrentTrail()">✎ Edit</button>
      </div>

      </div>

</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────
let currentTrailId = null;
let hikedFilter = '';
let debounceTimer = null;
let currentExecs = [];
let viewMode = localStorage.getItem('trailbear-view') || 'cards';

// ── View & filter toggles ──────────────────────────────────────────────────
function setView(mode) {
  viewMode = mode;
  localStorage.setItem('trailbear-view', mode);
  document.getElementById('btnCards').classList.toggle('active', mode === 'cards');
  document.getElementById('btnList').classList.toggle('active', mode === 'list');
  loadTrails();
}

function toggleFilters() {
  const panel = document.getElementById('filterPanel');
  const btn = document.getElementById('filterToggleBtn');
  const open = panel.classList.toggle('open');
  btn.classList.toggle('active', open);
}

// ── API helpers ───────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  if (r.status === 204) return null;
  const data = await r.json();
  if (!r.ok) {
    const detail = Array.isArray(data.detail)
      ? data.detail.map(e => `${e.loc?.slice(-1)[0] ?? ''}: ${e.msg}`).join(', ')
      : (data.detail || r.statusText);
    throw new Error(detail);
  }
  return data;
}

function toast(msg, isError) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3000);
}

// ── Stats ──────────────────────────────────────────────────────────────────
async function loadStats() {
  try {
    const s = await api('GET', '/api/stats');
    document.getElementById('statsBar').innerHTML = `
      <div class="stat"><span>${s.total}</span>trails</div>
      <div class="stat"><span>${s.hiked}</span>hiked</div>
      <div class="stat stat-todo"><span>${s.not_hiked}</span>to do</div>
      ${s.avg_rating ? `<div class="stat"><span>★${s.avg_rating}</span>avg</div>` : ''}
    `;
  } catch {}
}

// ── Load & render trails ───────────────────────────────────────────────────
function buildParams() {
  const p = new URLSearchParams();
  const v = id => document.getElementById(id).value;
  if (v('fSearch')) p.set('search', v('fSearch'));
  if (v('fActivity')) p.set('activity_type', v('fActivity'));
  if (v('fTrailType')) p.set('trail_type', v('fTrailType'));
  if (hikedFilter !== '') p.set('hiked', hikedFilter);
  if (v('fMinKm')) p.set('min_length_km', v('fMinKm'));
  if (v('fMaxKm')) p.set('max_length_km', v('fMaxKm'));
  if (v('fMinAsc')) p.set('min_ascend_m', v('fMinAsc'));
  if (v('fMaxAsc')) p.set('max_ascend_m', v('fMaxAsc'));
  if (v('fMinDrive')) p.set('min_drive_duration_min', v('fMinDrive'));
  if (v('fMaxDrive')) p.set('max_drive_duration_min', v('fMaxDrive'));
  if (v('fDateFrom')) p.set('date_from', v('fDateFrom'));
  if (v('fDateTo')) p.set('date_to', v('fDateTo'));
  if (v('sortBy')) p.set('sort_by', v('sortBy'));
  p.set('limit', '500');
  return p;
}

async function loadTrails() {
  const container = document.getElementById('trailContainer');
  try {
    const data = await api('GET', '/api/trails?' + buildParams());
    document.getElementById('trailCount').textContent = `${data.count} trail${data.count !== 1 ? 's' : ''}`;
    if (!data.items.length) {
      container.innerHTML = '<div class="empty"><div class="icon">🏔️</div>No trails match your filters.</div>';
      return;
    }
    if (viewMode === 'list') {
      container.innerHTML = `
        <div class="table-scroll">
          <table class="trail-table">
            <thead><tr>
              <th>Name</th>
              <th class="num">km</th>
              <th class="num">Duration</th>
              <th class="num">↑ m</th>
              <th class="num">🚗 min</th>
              <th class="num">Last hiked</th>
              <th class="num">★</th>
              <th></th>
            </tr></thead>
            <tbody>${data.items.map(renderRow).join('')}</tbody>
          </table>
        </div>`;
    } else {
      container.innerHTML = `<div class="cards">${data.items.map(renderCard).join('')}</div>`;
    }
  } catch (e) {
    container.innerHTML = `<div class="empty"><div class="icon">⚠️</div>${e.message}</div>`;
  }
}

function typeClass(tt) {
  if (!tt) return 'type-other';
  const l = tt.toLowerCase();
  if (l.includes('traumschleife')) return 'type-traumschleife';
  if (l.includes('auto')) return 'type-auto-pedestre';
  return 'type-other';
}
function fmtDur(min) {
  if (min == null) return '—';
  const h = Math.floor(min / 60), m = Math.round(min % 60);
  return h > 0 ? `${h}h ${String(m).padStart(2,'0')}m` : `${m}m`;
}
function fmtNum(v, dec, suffix) {
  if (v == null) return '—';
  const opts = typeof dec === 'number'
    ? { minimumFractionDigits: dec, maximumFractionDigits: dec }
    : {};
  return Number(v).toLocaleString(undefined, opts) + (suffix || '');
}
function fmtDate(s) {
  if (!s) return '—';
  const [y, m, d] = s.slice(0, 10).split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderCard(t) {
  const ratingHtml = t.avg_overall_rating != null
    ? `<span class="stars">★</span> ${fmtNum(t.avg_overall_rating, 1)}`
    : '<span style="color:var(--text-muted);font-size:.78rem;">unrated</span>';
  return `
  <div class="card">
    <div class="card-header">
      <div class="card-title">${esc(t.name)}</div>
      ${t.trail_type ? `<span class="card-type ${typeClass(t.trail_type)}">${esc(t.trail_type)}</span>` : ''}
    </div>
    <div class="card-meta">
      <div class="meta-item"><span class="icon">📏</span><strong>${fmtNum(t.distance_km, 1, ' km')}</strong></div>
      <div class="meta-item"><span class="icon">⏱</span><strong>${fmtDur(t.hike_duration_min)}</strong></div>
      <div class="meta-item"><span class="icon">⛰</span><strong>${fmtNum(t.elevation_gain_m, 0, ' m')}</strong></div>
      <div class="meta-item"><span class="icon">🚗</span><strong>${fmtNum(t.drive_time_min, 0, ' min')}</strong></div>
      ${t.last_executed_on ? `<div class="meta-item" style="grid-column:1/-1"><span class="icon">📅</span><strong>${fmtDate(t.last_executed_on)}</strong></div>` : ''}
    </div>
    <div class="card-footer">
      <div class="rating">${ratingHtml}</div>
      <div class="card-actions">
        ${t.url ? `<a href="${esc(t.url)}" target="_blank" class="btn-icon" title="Trail page">🔗</a>` : ''}
        ${t.garmin_course_url ? `<a href="${esc(t.garmin_course_url)}" target="_blank" class="btn-icon" title="Garmin">🗺</a>` : ''}
        <button class="btn-icon" onclick="openDetail(${t.id})" title="View & edit">✎</button>
      </div>
    </div>
  </div>`;
}

function renderRow(t) {
  const rating = t.avg_overall_rating != null
    ? `<span class="star">★</span> ${fmtNum(t.avg_overall_rating, 1)}`
    : '<span style="color:var(--text-muted)">—</span>';
  const badge = t.trail_type
    ? `<br><span class="row-badge ${typeClass(t.trail_type)}">${esc(t.trail_type)}</span>`
    : '';
  return `
    <tr>
      <td class="name-cell">${esc(t.name)}${badge}</td>
      <td class="num${t.distance_km == null ? ' muted' : ''}">${fmtNum(t.distance_km, 1)}</td>
      <td class="num${t.hike_duration_min == null ? ' muted' : ''}">${fmtDur(t.hike_duration_min)}</td>
      <td class="num${t.elevation_gain_m == null ? ' muted' : ''}">${fmtNum(t.elevation_gain_m, 0)}</td>
      <td class="num${t.drive_time_min == null ? ' muted' : ''}">${fmtNum(t.drive_time_min, 0)}</td>
      <td class="num${t.last_executed_on == null ? ' muted' : ''}">${fmtDate(t.last_executed_on)}</td>
      <td class="num">${rating}</td>
      <td>
        <div class="row-actions">
          ${t.url ? `<a href="${esc(t.url)}" target="_blank" class="btn-icon" title="Trail page">🔗</a>` : ''}
          ${t.garmin_course_url ? `<a href="${esc(t.garmin_course_url)}" target="_blank" class="btn-icon" title="Garmin">🗺</a>` : ''}
          <button class="btn-icon" onclick="openDetail(${t.id})" title="View & edit">✎</button>
        </div>
      </td>
    </tr>`;
}

// ── Filters ────────────────────────────────────────────────────────────────
function debouncedLoad() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(loadTrails, 350);
}

document.querySelectorAll('#fSearch,#fActivity,#fTrailType,#fMinKm,#fMaxKm,#fMinAsc,#fMaxAsc,#fMinDrive,#fMaxDrive,#fDateFrom,#fDateTo')
  .forEach(el => el.addEventListener('input', debouncedLoad));

document.querySelectorAll('.toggle-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    hikedFilter = btn.dataset.val;
    loadTrails();
  });
});

function resetFilters() {
  ['fSearch','fActivity','fTrailType','fMinKm','fMaxKm','fMinAsc','fMaxAsc','fMinDrive','fMaxDrive','fDateFrom','fDateTo','sortBy']
    .forEach(id => { document.getElementById(id).value = ''; });
  hikedFilter = '';
  document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('hikedAll').classList.add('active');
  loadTrails();
}

// ── Modal helpers ──────────────────────────────────────────────────────────
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.overlay').forEach(el =>
  el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open'); })
);

function showTab(id, e) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  e.target.classList.add('active');
  if (id === 'tabExecs') loadExecs();
  if (id === 'tabImps') loadImps();
}

// ── Add / Edit trail ───────────────────────────────────────────────────────
let editingTrailId = null;

function openAddTrail() {
  editingTrailId = null;
  document.getElementById('trailModalTitle').textContent = 'Add trail';
  document.getElementById('trailForm').reset();
  document.getElementById('trailModal').classList.add('open');
}

async function openDetail(id) {
  currentTrailId = id;
  document.getElementById('detailModal').classList.add('open');
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tabInfo').classList.add('active');
  document.querySelector('.tab-btn').classList.add('active');
  await loadDetailInfo();
}

async function loadDetailInfo() {
  try {
    const t = await api('GET', `/api/trails/${currentTrailId}`);
    document.getElementById('detailModalTitle').textContent = t.name;
    document.getElementById('detailInfo').innerHTML = `
      <table style="width:100%;border-collapse:collapse;font-size:.88rem;">
        ${row('Activity', t.activity_type)}
        ${row('Type', t.trail_type)}
        ${row('Distance', fmtNum(t.distance_km, 1, ' km'))}
        ${row('Duration', fmtDur(t.hike_duration_min))}
        ${row('Elevation gain', fmtNum(t.elevation_gain_m, 0, ' m'))}
        ${row('Elevation loss', fmtNum(t.elevation_loss_m, 0, ' m'))}
        ${row('Drive distance', fmtNum(t.drive_distance_km, 1, ' km'))}
        ${row('Drive time', fmtNum(t.drive_time_min, 0, ' min'))}
        ${row('Rating', t.avg_overall_rating != null ? '★ ' + fmtNum(t.avg_overall_rating, 1) : '—')}
        ${t.url ? `<tr><td style="padding:6px 0;color:var(--text-muted);width:130px">Trail URL</td><td style="word-break:break-all"><a href="${esc(t.url)}" target="_blank">${esc(t.url)}</a></td></tr>` : ''}
        ${t.gpx_url ? `<tr><td style="padding:6px 0;color:var(--text-muted)">GPX URL</td><td style="word-break:break-all"><a href="${esc(t.gpx_url)}" target="_blank">${esc(t.gpx_url)}</a></td></tr>` : ''}
        ${t.garmin_course_url ? `<tr><td style="padding:6px 0;color:var(--text-muted)">Garmin</td><td style="word-break:break-all"><a href="${esc(t.garmin_course_url)}" target="_blank">${esc(t.garmin_course_url)}</a></td></tr>` : ''}
        ${t.description ? `<tr><td style="padding:6px 0;color:var(--text-muted);vertical-align:top">Description</td><td style="font-size:.85rem;line-height:1.5">${esc(t.description)}</td></tr>` : ''}
      </table>`;
  } catch (e) { toast(e.message, true); }
}

function row(label, val) {
  if (val == null || val === '—' || val === '') return '';
  return `<tr><td style="padding:6px 0;color:var(--text-muted);width:130px;white-space:nowrap">${label}</td><td><strong>${esc(String(val))}</strong></td></tr>`;
}

function editCurrentTrail() {
  closeModal('detailModal');
  api('GET', `/api/trails/${currentTrailId}`).then(t => {
    editingTrailId = t.id;
    document.getElementById('trailModalTitle').textContent = 'Edit trail';
    const form = document.getElementById('trailForm');
    ['name','activity_type','trail_type','distance_km','hike_duration_min',
     'elevation_gain_m','elevation_loss_m','drive_distance_km','drive_time_min',
     'url','gpx_url','garmin_course_url','description'].forEach(f => {
      const el = form.elements[f];
      if (el) el.value = t[f] ?? '';
    });
    document.getElementById('trailModal').classList.add('open');
  });
}

async function submitTrailForm(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = {};
  for (const [k, v] of fd.entries()) {
    if (v === '') body[k] = null;
    else if (['distance_km','hike_duration_min','drive_distance_km','drive_time_min'].includes(k)) body[k] = parseFloat(v);
    else if (['elevation_gain_m','elevation_loss_m'].includes(k)) body[k] = parseInt(v, 10);
    else body[k] = v;
  }
  if (!body.trail_type) body.trail_type = null;
  try {
    if (editingTrailId) {
      if (body.name !== undefined) { body.new_name = body.name; delete body.name; }
      await api('PATCH', `/api/trails/${editingTrailId}`, body);
      toast('Trail updated ✓');
    } else {
      await api('POST', '/api/trails', body);
      toast('Trail added ✓');
    }
    closeModal('trailModal');
    loadTrails(); loadStats();
  } catch (err) { toast(err.message, true); }
}

async function deleteCurrentTrail() {
  if (!confirm('Delete this trail and all its hike records?')) return;
  try {
    await api('DELETE', `/api/trails/${currentTrailId}`);
    closeModal('detailModal');
    toast('Trail deleted');
    loadTrails(); loadStats();
  } catch (e) { toast(e.message, true); }
}

// ── Executions ─────────────────────────────────────────────────────────────
async function loadExecs() {
  const list = document.getElementById('execList');
  list.innerHTML = '<li style="color:var(--text-muted);font-size:.85rem">Loading…</li>';
  try {
    const data = await api('GET', `/api/trails/${currentTrailId}/executions`);
    currentExecs = data.items;
    if (!data.items.length) {
      list.innerHTML = '<li style="color:var(--text-muted);font-size:.85rem;padding:10px 0">No hikes recorded yet.</li>';
      return;
    }
    list.innerHTML = data.items.map(e => `
      <li class="exec-item">
        <span class="exec-date">📅 ${fmtDate(e.executed_on)}</span>
        <div class="item-actions"><button class="btn-sm" onclick="deleteExec(${e.id})">✕</button></div>
      </li>`).join('');
  } catch(err) { list.innerHTML = `<li style="color:red">${err.message}</li>`; }
}

async function addExecution() {
  const date = document.getElementById('newExecDate').value;
  if (!date) { toast('Pick a date first', true); return; }
  try {
    await api('POST', `/api/trails/${currentTrailId}/executions`, { executed_on: date });
    document.getElementById('newExecDate').value = '';
    toast('Hike recorded ✓');
    loadExecs(); loadStats(); loadTrails();
  } catch(e) { toast(e.message, true); }
}

async function deleteExec(id) {
  if (!confirm('Remove this hike record?')) return;
  try {
    await api('DELETE', `/api/executions/${id}`);
    toast('Removed');
    loadExecs(); loadStats(); loadTrails();
  } catch(e) { toast(e.message, true); }
}

// ── Impressions ────────────────────────────────────────────────────────────
const RATING_OPTS = ['','1','1.5','2','2.5','3','3.5','4','4.5','5'];
const RATING_LABELS = ['No rating','★ 1','★ 1.5','★★ 2','★★ 2.5','★★★ 3','★★★ 3.5','★★★★ 4','★★★★ 4.5','★★★★★ 5'];

function ratingSelect(selected) {
  return `<select class="imp-rating-sel">
    ${RATING_OPTS.map((v,i) => `<option value="${v}"${String(v) === String(selected ?? '') ? ' selected' : ''}>${RATING_LABELS[i]}</option>`).join('')}
  </select>`;
}

function impInlineForm(key, execId, imp) {
  const isEdit = imp != null;
  const saveCall = isEdit
    ? `saveImp('edit', ${imp.id}, 0, this.closest('.imp-inline-form'))`
    : `saveImp('add', 0, ${execId}, this.closest('.imp-inline-form'))`;
  const cancelCall = `toggleImpForm('${key}')`;
  return `
    <div class="imp-inline-form" id="impform-${key}">
      <div class="imp-form-row">
        ${ratingSelect(isEdit ? imp.overall_rating : '')}
        <input type="text" placeholder="Weather…" value="${esc(isEdit ? (imp.weather||'') : '')}">
        <input type="text" placeholder="Difficulty…" value="${esc(isEdit ? (imp.difficulty||'') : '')}">
      </div>
      <textarea class="imp-form-textarea" placeholder="Notes…">${esc(isEdit ? (imp.notes||'') : '')}</textarea>
      <div class="imp-form-footer">
        <button class="btn-sm" onclick="${cancelCall}">Cancel</button>
        <button class="btn-primary" style="padding:6px 14px;font-size:.85rem" onclick="${saveCall}">Save</button>
      </div>
    </div>`;
}

function toggleImpForm(key) {
  const el = document.getElementById(`impform-${key}`);
  if (el) el.classList.toggle('open');
}

async function saveImp(mode, impId, execId, formEl) {
  const rating = formEl.querySelector('.imp-rating-sel').value;
  const inputs = formEl.querySelectorAll('input[type=text]');
  const weather = inputs[0].value;
  const difficulty = inputs[1].value;
  const notes = formEl.querySelector('textarea').value;
  const body = {
    overall_rating: rating ? parseFloat(rating) : null,
    notes: notes || null, weather: weather || null, difficulty: difficulty || null,
  };
  try {
    if (mode === 'edit') {
      await api('PATCH', `/api/impressions/${impId}`, body);
      toast('Impression updated ✓');
    } else {
      await api('POST', `/api/executions/${execId}/impressions`, body);
      toast('Impression added ✓');
    }
    loadImps(); loadTrails(); loadStats();
  } catch(e) { toast(e.message, true); }
}

async function loadImps() {
  const list = document.getElementById('impList');
  list.innerHTML = '<li style="padding:12px 0;color:var(--text-muted);font-size:.85rem;list-style:none">Loading…</li>';
  try {
    const [execData, impData] = await Promise.all([
      api('GET', `/api/trails/${currentTrailId}/executions`),
      api('GET', `/api/trails/${currentTrailId}/impressions`),
    ]);
    currentExecs = execData.items;

    if (!execData.items.length) {
      list.innerHTML = '<li style="padding:12px 0;color:var(--text-muted);font-size:.85rem;list-style:none">No hikes recorded yet — add a hike date in the Hikes tab first.</li>';
      return;
    }

    // Map execution_id → impression
    const byExec = Object.fromEntries(impData.items.map(i => [i.execution_id, i]));

    list.innerHTML = execData.items.map(exec => {
      const imp = byExec[exec.id];
      const addKey = `add-${exec.id}`;
      const editKey = imp ? `edit-${imp.id}` : '';

      const impBody = imp ? `
        <div class="imp-body">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            ${imp.overall_rating != null ? `<span class="imp-stars">★ ${fmtNum(imp.overall_rating, 1)}</span>` : ''}
            <div class="imp-tags">
              ${imp.weather ? `<span class="imp-tag">${esc(imp.weather)}</span>` : ''}
              ${imp.difficulty ? `<span class="imp-tag green">${esc(imp.difficulty)}</span>` : ''}
            </div>
          </div>
          ${imp.notes ? `<div class="imp-notes-text">${esc(imp.notes)}</div>` : ''}
        </div>
        ${impInlineForm(editKey, exec.id, imp)}` :
        `<div class="imp-body-empty">No impression recorded</div>
        ${impInlineForm(addKey, exec.id, null)}`;

      const actions = imp ? `
        <button class="btn-sm" onclick="toggleImpForm('${editKey}')" title="Edit">✎</button>
        <button class="btn-sm" onclick="deleteImp(${imp.id})" title="Delete">✕</button>` :
        `<button class="btn-sm" onclick="toggleImpForm('${addKey}')">＋ Add</button>`;

      return `<li class="imp-exec-card">
        <div class="imp-exec-header">
          <span class="imp-exec-date">📅 ${fmtDate(exec.executed_on)}</span>
          <div class="item-actions">${actions}</div>
        </div>
        ${impBody}
      </li>`;
    }).join('');
  } catch(err) { list.innerHTML = `<li style="color:red;list-style:none">${err.message}</li>`; }
}

async function deleteImp(id) {
  if (!confirm('Delete this impression?')) return;
  try {
    await api('DELETE', `/api/impressions/${id}`);
    toast('Removed');
    loadImps(); loadTrails(); loadStats();
  } catch(e) { toast(e.message, true); }
}

// ── Excel / CSV export ────────────────────────────────────────────────────
async function exportExcel() {
  try {
    const data = await api('GET', '/api/trails?' + buildParams().toString().replace('limit=500', 'limit=1000'));
    if (!data.items.length) { toast('No trails to export', true); return; }

    const headers = ['Name', 'Type', 'Activity', 'Distance (km)', 'Duration (min)', 'Elevation gain (m)', 'Elevation loss (m)', 'Drive distance (km)', 'Drive time (min)', 'Last Hiked', 'Rating', 'Trail URL', 'GPX URL', 'Garmin URL'];

    function csvCell(v) {
      if (v == null || v === '') return '';
      const s = String(v);
      if (s.includes(',') || s.includes('"') || s.includes('\n')) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }

    const rows = data.items.map(t => [
      t.name,
      t.trail_type ?? '',
      t.activity_type ?? '',
      t.distance_km ?? '',
      t.hike_duration_min ?? '',
      t.elevation_gain_m ?? '',
      t.elevation_loss_m ?? '',
      t.drive_distance_km ?? '',
      t.drive_time_min ?? '',
      t.last_executed_on ?? '',
      t.avg_overall_rating != null ? Number(t.avg_overall_rating).toFixed(1) : '',
      t.url ?? '',
      t.gpx_url ?? '',
      t.garmin_course_url ?? '',
    ].map(csvCell).join(','));

    const csv = '﻿' + [headers.map(csvCell).join(','), ...rows].join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `trailbear-export-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    toast(`Exported ${data.items.length} trails ✓`);
  } catch(e) { toast(e.message, true); }
}

// ── Boot ──────────────────────────────────────────────────────────────────
document.getElementById('btnCards').classList.toggle('active', viewMode === 'cards');
document.getElementById('btnList').classList.toggle('active', viewMode === 'list');
loadStats();
loadTrails();
</script>
